version: 1
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      storagePath:
        type: string
        description: "Custom path for storing settings (leave empty for default)"
        default: ""
      debug:
        type: boolean
        description: "Enable debug logging"
        default: false
    required: []
  commandFunction: |-
    (config) => ({ 
      command: 'node', 
      args: ['dist/index.js'], 
      env: { 
        SMITHERY_PROFILE_PATH: config.storagePath || '',
        DEBUG: config.debug ? 'true' : 'false'
      } 
    })
exampleConfig:
  storagePath: ""
  debug: false
description: "📁 Environment Settings MCP - Simple storage and management of environment variables and settings via Smithery.ai hosting"
tags:
  - "environment"
  - "settings"
  - "config"
  - "storage"
